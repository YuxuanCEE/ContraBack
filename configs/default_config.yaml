Model:
    TimesNet:
        task_name: short_term_forecast
        seq_len: 12
        label_len: 12
        pred_len: 12
        e_layers: 2
        embed: timeF
        freq: t
        dropout: 0.1
        top_k: 5
        d_model: 256
        d_ff: 256
        factor: 3
        num_kernels: 6
        output_attention: 0
        distil: 1

    FEDformer:
        task_name: short_term_forecast
        seq_len: 12
        label_len: 12
        pred_len: 12
        e_layers: 2
        d_layers: 1
        num_kernels: 6
        embed: timeF
        freq: t
        dropout: 0.1
        d_model: 512
        d_ff: 2048
        n_heads: 8
        factor: 3
        output_attention: 0
        distil: 1
        activation: gelu
        moving_avg: 25

    Autoformer:
        task_name: short_term_forecast
        seq_len: 12
        label_len: 12
        pred_len: 12
        e_layers: 2
        d_layers: 1
        num_kernels: 6
        embed: timeF
        freq: t
        dropout: 0.1
        d_model: 512
        d_ff: 2048
        n_heads: 8
        factor: 3
        output_attention: 0
        distil: 1
        activation: gelu
        moving_avg: 25

    PatchTST:
        task_name: long_term_forecast
        seq_len: 96
        label_len: 48
        pred_len: 96
        enc_in: 1
        dec_in: 1
        c_out: 1
        d_model: 128
        n_heads: 8
        e_layers: 3
        d_ff: 256
        factor: 3
        dropout: 0.1
        fc_dropout: 0.1
        head_dropout: 0.0
        patch_len: 16
        stride: 8
        padding_patch: end
        revin: 0
        affine: 0
        subtract_last: 0
        decomposition: 0
        kernel_size: 25
        individual: 0
        embed: timeF
        freq: t
        activation: gelu

    T3Time:
        task_name: long_term_forecast
        seq_len: 288
        label_len: 48
        pred_len: 96
        enc_in: 1
        dec_in: 1
        c_out: 1
        num_nodes: 1
        channel: 32
        d_llm: 768
        e_layer: 1
        d_layer: 1
        d_ff: 32
        head: 8
        dropout_n: 0.2
        num_cma_heads: 4
        llm_model_path: ./pretrained_models/gpt2
        prompt_max_length: 512
        prompt_value_round: 4
        dataset_name: custom
        content: A custom multivariate time series forecasting dataset.

    TimeLLM:
        task_name: long_term_forecast
        seq_len: 96
        label_len: 48
        pred_len: 96
        enc_in: 1
        dec_in: 1
        c_out: 1
        d_model: 128
        n_heads: 8
        d_ff: 768
        factor: 3
        dropout: 0.1
        patch_len: 16
        stride: 8
        padding: 0
        top_k: 5
        llm_model: GPT2
        llm_model_path: ./pretrained_models/gpt2
        llm_dim: 768
        llm_layers: 1
        num_tokens: 1000
        prompt_domain: 1
        prompt_max_length: 2048

    TimeVLM:
        task_name: long_term_forecast
        seq_len: 288
        label_len: 48
        pred_len: 96
        enc_in: 1
        dec_in: 1
        c_out: 1
        d_model: 128
        n_heads: 8
        d_ff: 256
        factor: 3
        dropout: 0.1
        patch_len: 16
        stride: 8
        padding: 8
        top_k: 5
        patch_memory_size: 100
        vlm_type: CLIP
        vlm_model_path: ./pretrained_models/clip-vit-base-patch32
        image_size: 224
        image_hidden_dim: 48
        periodicity: 96
        norm_const: 1.0
        three_channel_image: True
        finetune_vlm: False
        learnable_image: True
        save_images: False
        save_image_dir: ts-images2/timevlm
        save_negative_image_dir: ts-images2/negative
        color_enhancement: blue_mapping_inverted
        timevlm_heads: 4
        use_gpu: True
        gpu: 0

